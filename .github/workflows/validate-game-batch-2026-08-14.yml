name: Validate game screenshots batch 2026-08-14

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/validate_game_batch_2026_08_14.py"
      - ".github/workflows/validate-game-batch-2026-08-14.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate screenshots against API and NavalGaming
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/validate_game_batch_2026_08_14.py
      - name: Commit report
        run: |
          git config user.name "naval-action-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/game_batch_2026_08_14.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: save multi-port game validation report"
          git pull --rebase origin main
          git push
