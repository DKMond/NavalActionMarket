name: Collect MAIN market snapshot

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Data provider
        required: true
        default: api
        type: choice
        options:
          - api
          - html
      allow_html:
        description: Explicitly permit fallback HTML collection for this run
        required: false
        default: false
        type: boolean

# Scheduled triggers will be enabled after authorized data-source access is confirmed.
# To remain DST-safe, the future schedule should fire at the UTC candidates for
# 12:55 and 13:35-13:55 Europe/Bucharest and use schedule_guard.py before collection.

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect snapshot
        env:
          MARKET_PROVIDER: ${{ inputs.provider }}
          NAAPI_BASE_URL: ${{ secrets.NAAPI_BASE_URL }}
          NAAPI_API_KEY: ${{ secrets.NAAPI_API_KEY }}
          NAAPI_SNAPSHOT_PATH: ${{ secrets.NAAPI_SNAPSHOT_PATH }}
          ALLOW_HTML_COLLECTOR: ${{ inputs.allow_html && '1' || '0' }}
        run: python -m naval_action_market.cli --provider "$MARKET_PROVIDER"

      - name: Commit validated snapshot
        run: |
          git config user.name "naval-action-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history/
          if git diff --cached --quiet; then
            echo "No validated snapshot changes to commit"
            exit 0
          fi
          git commit -m "data: collect MAIN market snapshot"
          git push
