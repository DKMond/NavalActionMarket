name: Collect MAIN market snapshot

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Data provider
        required: true
        default: shard
        type: choice
        options:
          - shard
          - html
          - api
      allow_html:
        description: Explicitly permit fallback HTML collection for this run
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "naval_action_market/config.py"
      - "naval_action_market/public_shard.py"
      - "naval_action_market/routes.py"
      - "naval_action_market/route_cli.py"
      - "naval_action_market/cli.py"
      - "naval_action_market/schema.py"
      - "scripts/export_google_sheet_csvs.py"
      - ".github/workflows/collect.yml"

# Automatic daily scheduling is intentionally not enabled until the user's
# reset-time timezone is explicitly confirmed. The production data source no
# longer depends on NavalGaming HTML.

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect snapshot
        env:
          MARKET_PROVIDER: ${{ inputs.provider || 'shard' }}
          NAAPI_BASE_URL: ${{ secrets.NAAPI_BASE_URL }}
          NAAPI_API_KEY: ${{ secrets.NAAPI_API_KEY }}
          NAAPI_SNAPSHOT_PATH: ${{ secrets.NAAPI_SNAPSHOT_PATH }}
          ALLOW_HTML_COLLECTOR: ${{ inputs.allow_html && '1' || '0' }}
        run: python -m naval_action_market.cli --provider "$MARKET_PROVIDER"

      - name: Build default route preview
        if: ${{ (inputs.provider || 'shard') == 'shard' }}
        run: python -m naval_action_market.route_cli --snapshot data/latest.json --cargo 1000 --reals 1000000 --min-roi 0 --limit 100 --output data/latest_routes.json

      - name: Export Google Sheets tables
        if: ${{ (inputs.provider || 'shard') == 'shard' }}
        run: python scripts/export_google_sheet_csvs.py

      - name: Commit validated snapshot
        run: |
          git config user.name "naval-action-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/latest_routes.json data/google_sheets/ data/history/
          if git diff --cached --quiet; then
            echo "No validated snapshot changes to commit"
            exit 0
          fi
          git commit -m "data: collect MAIN public-shard snapshot"
          git push
