name: Probe Aves in-game ground truth

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_aves_ground_truth.py"
      - ".github/workflows/probe-aves-ground-truth.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Probe Aves API vs NavalGaming vs in-game screenshots
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/probe_aves_ground_truth.py

      - name: Commit report
        if: always()
        run: |
          if [ ! -f research/aves_ground_truth_compare.json ]; then
            echo "No Aves report generated"
            exit 0
          fi
          git config user.name "naval-action-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/aves_ground_truth_compare.json
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "research: compare Aves API with in-game ground truth"
          git pull --rebase origin main
          git push origin HEAD:main
