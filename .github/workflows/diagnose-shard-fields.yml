name: Diagnose public shard fields

on:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose_shard_fields.py"
      - ".github/workflows/diagnose-shard-fields.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.32.3
      - run: python scripts/diagnose_shard_fields.py
